name: Apply Phase 2.2 implementation

on:
  push:
    branches: ["agent/phase-2-2-source-adjudication"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-2-2-source-adjudication
          fetch-depth: 0
      - name: Reconstruct the locally verified implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .phase22/chunk* | base64 --decode > /tmp/phase22.tar.gz
          echo "eec3c372132b88c2b9e1f88e1d7c8cde182bdc8c4684aea3b02a29b1704f3ff8  /tmp/phase22.tar.gz" | sha256sum --check
          tar -xzf /tmp/phase22.tar.gz
          python -m py_compile \
            backend/app/services/canonical_source_phase22.py \
            backend/app/services/canonical_source_phase22_contract.py
          git rm -r .phase22 .github/workflows/export-agent-snapshot.yml
          git add backend frontend docs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Phase 2.2 evidence-backed source adjudication"
          git push origin HEAD:agent/phase-2-2-source-adjudication
