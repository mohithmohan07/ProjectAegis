name: Apply Phase 3 backend batch

# Retrigger after the workflow became part of the branch history.
on:
  push:
    branches: ["agent/phase-3-universal-semantic-graph"]
    paths:
      - ".github/workflows/apply-phase3-backend-batch.yml"

permissions:
  contents: write

concurrency:
  group: apply-phase3-backend-batch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-universal-semantic-graph
          fetch-depth: 0

      - name: Reconstruct and verify implementation archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .phase3/backend-batch ]; then
            echo "Phase 3 backend batch already applied."
            exit 0
          fi
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.phase3/backend-batch').glob('part-*'))
          if len(parts) != 5:
              raise SystemExit(f'Expected 5 payload parts, found {len(parts)}')
          encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          expected = 'a13d1ab3f14bd8623eb88f380cdf48827c62d8d169c64b240671a5337c93ffb3'
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f'Archive SHA mismatch: {actual}')
          if not archive.startswith(b'\xfd7zXZ\x00'):
              raise SystemExit('Payload is not an XZ archive')
          Path('/tmp/phase3-backend-batch.tar.xz').write_bytes(archive)
          PY
          tar -tJf /tmp/phase3-backend-batch.tar.xz > /tmp/phase3-backend-files.txt
          if grep -Eq '(^|/)\.git(/|$)|^/|(^|/)\.github/workflows/' /tmp/phase3-backend-files.txt; then
            echo "Archive contains a forbidden path" >&2
            cat /tmp/phase3-backend-files.txt >&2
            exit 1
          fi
          cat /tmp/phase3-backend-files.txt

      - name: Materialize Phase 3 backend implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .phase3/backend-batch ]; then
            exit 0
          fi
          tar -xJf /tmp/phase3-backend-batch.tar.xz -C .
          rm -rf .phase3/backend-batch
          rm -f .github/workflows/apply-phase3-backend-batch.yml
          git diff --stat

      - name: Verify focused backend contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          cd backend
          python scripts/generate_dummy_data.py
          pytest -q \
            tests/test_canonical_source_phase3.py \
            tests/test_canonical_source_phase3_contract.py \
            tests/test_build_concepts.py \
            tests/test_source_artifact_flow.py

      - name: Commit actual implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- backend/data/bulk_import_database.xlsx
          find backend/data -type f \( -name '*.db-wal' -o -name '*.db-shm' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Implementation archive produced no changes" >&2
            exit 1
          fi
          git status --short
          git commit -m "Integrate Phase 3 API-first semantic graph"
          git push origin HEAD:agent/phase-3-universal-semantic-graph
