name: Deploy

# Merged and live must never drift apart (owner request, 2026-08-29): two
# production runs executed against a build that predated the fixes merged
# minutes earlier, because deployment was manual. Every push to main now
# deploys to Fly automatically. PRs already carry their own CI, and plain
# pushes to main deliberately do not re-run it (owner rulings, 21/26 Aug
# 2026), so this workflow deploys exactly what was merged.
#
# Requires the FLY_API_TOKEN repository secret (Settings → Secrets and
# variables → Actions): create one with `fly tokens create deploy -x 999999h`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Finish each handoff before deploying the next revision.
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA, not the mutable master ref: this job holds
      # FLY_API_TOKEN, so the action it runs must be immutable (a compromised
      # upstream branch on the next push to main could exfiltrate the token).
      # Update the pin deliberately, by choosing a new reviewed commit.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master / v1, 2026-08-29
      - name: Preserve current run identities and verify an online database backup
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python - <<'PYCODE'
          import base64, os, pathlib, shlex, subprocess
          payload = base64.b64encode(pathlib.Path('backend/scripts/deploy_run_snapshot.py').read_bytes()).decode('ascii')
          code = "import base64,sys;sys.argv=['snapshot'," + repr(os.environ['GITHUB_SHA']) + "];exec(base64.b64decode(" + repr(payload) + "))"
          subprocess.run(['flyctl', 'ssh', 'console', '-a', 'projectaegis', '-C', 'python -c ' + shlex.quote(code)], check=True)
          PYCODE
      - run: flyctl deploy --remote-only --env "AEGIS_RELEASE_SHA=$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The script waits for /health at this exact SHA before inspecting the
      # migrated DB. Merely reaching SSH does not establish app startup.
      - name: Verify application release and preserved run identities
        run: flyctl ssh console -a projectaegis -C "python /app/scripts/deploy_run_snapshot.py $GITHUB_SHA --after"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
