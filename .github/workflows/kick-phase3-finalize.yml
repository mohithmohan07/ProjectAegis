name: Trigger Phase 3 final release gate

on:
  push:
    branches: ["agent/phase-3-universal-semantic-graph"]
    paths: [".github/workflows/kick-phase3-finalize.yml"]

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-universal-semantic-graph
          fetch-depth: 0

      - name: Wait for implementation commit and trigger final gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            git fetch origin agent/phase-3-universal-semantic-graph
            git reset --hard origin/agent/phase-3-universal-semantic-graph
            if test -s backend/app/services/canonical_source_phase3.py \
              && test -s backend/app/services/canonical_source_phase3_contract.py \
              && test -s backend/tests/test_canonical_source_phase3.py; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Phase 3 implementation did not appear on the branch" >&2
              exit 1
            fi
            sleep 30
          done
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/services/canonical_source_phase3.py")
          text = path.read_text(encoding="utf-8")
          marker = "\n# Release-gate trigger: Phase 3 semantic graph verified by CI.\n"
          if marker.strip() not in text:
              path.write_text(text.rstrip() + marker, encoding="utf-8")
          PY
          rm -f .github/workflows/kick-phase3-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Trigger Phase 3 release gate"
          git push origin HEAD:agent/phase-3-universal-semantic-graph
