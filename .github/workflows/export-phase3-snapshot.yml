name: Export Phase 3 development snapshot

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/export-phase3-snapshot.yml"
      - ".phase3/payload.b64"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-universal-semantic-graph
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-repository-snapshot
          path: |
            .
          include-hidden-files: true
          retention-days: 1
