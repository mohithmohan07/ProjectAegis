name: Export Phase 3 development snapshot

on:
  push:
    branches: ["agent/phase-3-universal-semantic-graph"]
    paths: [".github/workflows/export-phase3-snapshot.yml"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-repository-snapshot
          path: |
            .
          include-hidden-files: true
          retention-days: 1
