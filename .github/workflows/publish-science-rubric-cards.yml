name: Publish reviewed Science rubric cards only

on:
  push:
    branches: [codex/social-english-image-assets]
    paths:
      - '.github/workflows/publish-science-rubric-cards.yml'
      - 'ops/concept-image-assets/2026-11-12-science-rubric-cards/**'

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  publish-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Publish 19 approved diagram-and-criterion cards and verify public URLs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python backend/scripts/publish_concept_images.py --assets ops/concept-image-assets/2026-11-12-science-rubric-cards
      - name: Save verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: science-rubric-card-url-verification
          path: image-url-verification.json
          if-no-files-found: error
