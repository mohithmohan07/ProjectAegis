name: Apply Phase 2.2.1 implementation

on:
  push:
    branches: ["agent/phase-2-2-1-pdf-acsd-fallback"]
    paths: [".phase221/payload.part11"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-2-2-1-pdf-acsd-fallback
          fetch-depth: 0
      - name: Apply verified development payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase221/payload.part* | base64 --decode > /tmp/phase221.tgz
          tar -xzf /tmp/phase221.tgz -C .
          rm -rf .phase221
          rm -f .github/workflows/apply-phase221-payload.yml
          rm -f .github/workflows/export-phase221-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Phase 2.2.1 PDF-to-ACSD recovery"
          git push origin HEAD:agent/phase-2-2-1-pdf-acsd-fallback
