name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/generate_dummy_data.py
      - name: Run backend tests with diagnostics
        id: backend-tests
        continue-on-error: true
        run: |
          set +e
          pytest -q > /tmp/pytest.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload backend diagnostics
        if: steps.backend-tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pytest-failure
          path: /tmp/pytest.log
          retention-days: 1
      - name: Fail when backend tests fail
        if: steps.backend-tests.outputs.status != '0'
        run: exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test -- --run
