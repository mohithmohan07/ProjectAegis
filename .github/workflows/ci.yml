name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run dummy-data bootstrap with diagnostics
        id: dummy-data
        continue-on-error: true
        run: |
          set +e
          python scripts/generate_dummy_data.py > /tmp/dummy-data.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload dummy-data diagnostics
        if: steps.dummy-data.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-dummy-data-failure
          path: /tmp/dummy-data.log
          retention-days: 1
      - name: Fail when dummy-data bootstrap fails
        if: steps.dummy-data.outputs.status != '0'
        run: exit 1
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test -- --run
