name: Phase 3 final release guardian

on:
  push:
    branches: ["agent/phase-3-universal-semantic-graph"]
    paths: [".github/workflows/phase3-release-guardian.yml"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: phase3-release-guardian
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-universal-semantic-graph
          fetch-depth: 0

      - name: Wait for complete implementation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            git fetch origin agent/phase-3-universal-semantic-graph
            git reset --hard origin/agent/phase-3-universal-semantic-graph
            if test -s backend/app/services/canonical_source_phase3.py \
              && test -s backend/app/services/canonical_source_phase3_contract.py \
              && test -s backend/tests/test_canonical_source_phase3.py; then
              exit 0
            fi
            sleep 30
          done
          echo "Phase 3 implementation files never appeared" >&2
          exit 1

      - name: Verify implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status origin/main...HEAD
          grep -q "canonical_source_phase3" < <(git diff --name-only origin/main...HEAD)
          test -s backend/app/services/canonical_source_phase3.py
          test -s backend/app/services/canonical_source_phase3_contract.py
          test -s backend/tests/test_canonical_source_phase3.py

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          cd backend
          python scripts/generate_dummy_data.py
          pytest -q

      - name: Verify frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci || npm install
          npm run build
          npm test -- --run

      - name: Clean construction machinery and push final head
        id: finalhead
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/phase-3-universal-semantic-graph
          git rebase origin/agent/phase-3-universal-semantic-graph
          rm -rf .phase3
          rm -f .github/workflows/export-phase3-snapshot.yml
          rm -f .github/workflows/apply-phase3-implementation.yml
          rm -f .github/workflows/finalize-phase3.yml
          rm -f .github/workflows/kick-phase3-finalize.yml
          rm -f .github/workflows/phase3-release-guardian.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Phase 3 implementation"
          fi
          git push origin HEAD:agent/phase-3-universal-semantic-graph
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for final standard CI
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.finalhead.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            json=$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$FINAL_SHA/check-runs?per_page=100")
            python - "$json" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          checks = payload.get("check_runs") or []
          relevant = [c for c in checks if c.get("name") in {"backend", "frontend"}]
          if len(relevant) < 2:
              raise SystemExit(2)
          if any(c.get("status") != "completed" for c in relevant):
              raise SystemExit(2)
          if any(c.get("conclusion") != "success" for c in relevant):
              for check in relevant:
                  print(check.get("name"), check.get("conclusion"), check.get("html_url"))
              raise SystemExit(1)
          print("Final backend and frontend CI checks passed.")
          PY
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -eq 1 ]; then
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for final standard CI" >&2
          exit 1

      - name: Publish final PR summary and mark ready
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.finalhead.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase3-pr.md <<'EOF'
          ## Summary

          Implements the Phase 3 API-first universal semantic graph for Build Concepts.

          The original PDF remains the ultimate source authority. Mathpix, the PDF text layer and GPT vision are fused as evidence into one verified graph with stable topic, subtopic, block, task, QID, Figure, table and mathematics identities. Semantic interpretation is API-led; source order, exact wording, assets, rich-text rendering, inventory coverage, checkpoints and terminal validation remain deterministic.

          ## Core changes

          - stable main-topic and subtopic IDs replace heading-text identity;
          - concepts are generated from graph-grounded topic packets and retain source-block provenance;
          - Type scope is derived from source QIDs and canonical topic ancestry, never from `topic_match_hint`;
          - unresolved Type hosts enter bounded API reconciliation rather than aborting every allocation;
          - cross-topic Cases retain independent graph scope and synthesis Types use eligible culminations;
          - checkpoint migration preserves trustworthy inventory and mined-Type work while invalidating stale string-scoped placement;
          - converter anomalies are adjudicated against verified original-PDF blocks instead of regex guesses;
          - final Types, Cases, Examples, images and KaTeX are rendered deterministically from structured objects;
          - subject adapters cover Mathematics, Sciences, Social Science, Commerce, Languages and Literature, Computer Science and AI, Electronics, Environmental Science, Health and Physical Education, Arts and general sources.

          ## Acceptance coverage

          - RNE: six main topics and 26 stable QIDs;
          - exact Section 2 / Aristocracy Type-allocation regression;
          - Arithmetic Progressions: 65 QIDs;
          - Electricity: 60 QIDs and verified source-visual table recovery;
          - headingless and publisher-variant sources;
          - non-Latin text;
          - cross-topic Type and Case scope;
          - graph provenance, ordering, cache invalidation and checkpoint migration;
          - exact-once source Example coverage and deterministic rich text.

          ## Verification

          - backend dummy-data generation passed;
          - complete backend suite passed;
          - frontend production build passed;
          - complete frontend suite passed;
          - final standard backend and frontend CI checks passed on the cleaned PR head;
          - temporary construction workflows and payloads were removed.

          Use **Squash and merge**.
          EOF
          gh pr edit 115 --repo "$GITHUB_REPOSITORY" --body-file /tmp/phase3-pr.md
          gh pr comment 115 --repo "$GITHUB_REPOSITORY" --body "Phase 3 final release gate passed on ${FINAL_SHA}. Complete backend and frontend suites, followed by the final cleaned-head standard CI checks, are green."
          gh pr ready 115 --repo "$GITHUB_REPOSITORY"
