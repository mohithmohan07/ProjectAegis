name: Finalize Phase 3 release gate

on:
  push:
    branches: ["agent/phase-3-universal-semantic-graph"]
    paths:
      - "backend/app/services/canonical_source_phase3.py"
      - "backend/app/services/canonical_source_phase3_contract.py"
      - "backend/tests/test_canonical_source_phase3.py"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: phase3-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-universal-semantic-graph
          fetch-depth: 0

      - name: Verify implementation scope
        shell: bash
        run: |
          set -euo pipefail
          required=(
            backend/app/services/canonical_source_phase3.py
            backend/app/services/canonical_source_phase3_contract.py
            backend/tests/test_canonical_source_phase3.py
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing required Phase 3 file: $path" >&2; exit 1; }
          done
          forbidden=(
            .github/workflows/export-phase3-snapshot.yml
            .github/workflows/apply-phase3-implementation.yml
            .phase3
          )
          for path in "${forbidden[@]}"; do
            test ! -e "$path" || { echo "Temporary construction artifact remains: $path" >&2; exit 1; }
          done
          git diff --name-status origin/main...HEAD

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          cd backend
          python scripts/generate_dummy_data.py
          pytest -q

      - name: Verify frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci || npm install
          npm run build
          npm test -- --run

      - name: Remove release-gate workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-phase3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Phase 3 release gate"
          git push origin HEAD:agent/phase-3-universal-semantic-graph

      - name: Update PR and mark ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase3-pr.md <<'EOF'
          ## Summary

          Implements the Phase 3 API-first universal semantic graph for Build Concepts.

          The original PDF remains the ultimate source authority. Mathpix, the PDF text layer and GPT vision are fused as evidence into one verified graph with stable topic, subtopic, block, task, QID, Figure, table and mathematics identities. Semantic interpretation is API-led; source order, exact wording, assets, rich-text rendering, inventory coverage, checkpoints and terminal validation remain deterministic.

          ## Core changes

          - stable main-topic and subtopic IDs replace heading-text identity;
          - concepts are generated from graph-grounded topic packets and retain source-block provenance;
          - Type scope is derived from source QIDs and canonical topic ancestry, never from `topic_match_hint`;
          - missing Type hosts enter bounded API reconciliation instead of aborting every allocation;
          - cross-topic Cases retain their own graph scope and synthesis Types use eligible culminations;
          - checkpoint migration preserves trustworthy inventory and mined-Type work while invalidating stale string-scoped placement;
          - converter anomalies are adjudicated against verified original-PDF blocks rather than repaired through regex guesses;
          - final Types, Cases, Examples, images and KaTeX are rendered deterministically from structured objects;
          - subject adapters cover Mathematics, physical and life sciences, Social Science, Commerce, Languages and Literature, Computer Science and AI, Electronics, Environmental Science, Health and Physical Education, Arts and general sources.

          ## Regression coverage

          The release gate runs the complete backend and frontend suites and includes dedicated coverage for:

          - RNE with six main topics and 26 stable QIDs;
          - the exact Section 2 / `The Aristocracy and the New Middle Class` Type-allocation failure;
          - Arithmetic Progressions with 65 QIDs;
          - Electricity with 60 QIDs and source-visual table recovery;
          - headingless and publisher-variant sources;
          - non-Latin text;
          - cross-topic Type and Case scope;
          - graph ordering, provenance, cache invalidation and checkpoint migration;
          - exact-once source Example coverage and deterministic rich text.

          ## Verification

          The Phase 3 release-gate workflow completed:

          - backend dummy-data generation;
          - complete backend test suite;
          - frontend production build;
          - complete frontend test suite;
          - temporary construction-artifact inspection.

          Use **Squash and merge** after reviewing the final diff and the latest standard CI run.
          EOF
          gh pr edit 115 --repo "$GITHUB_REPOSITORY" --body-file /tmp/phase3-pr.md
          gh pr comment 115 --repo "$GITHUB_REPOSITORY" --body "Phase 3 release gate passed on commit ${GITHUB_SHA}. Complete backend and frontend suites are green; temporary construction workflows were removed."
          gh pr ready 115 --repo "$GITHUB_REPOSITORY"
