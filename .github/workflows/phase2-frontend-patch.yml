name: Apply Phase 2 frontend copy

on:
  push:
    branches:
      - agent/phase-2-canonical-source-inventory

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-2-canonical-source-inventory
      - name: Remove duplicate Phase 2 metadata line
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path("frontend/src/components/DocumentUpload.tsx")
          text = component.read_text(encoding="utf-8")
          line = '          {manifest.phase ? ` · ${manifest.phase.replace(/-/g, " ")}` : ""}\n'
          text = text.replace(line + line, line)
          component.write_text(text, encoding="utf-8")
          PY
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/DocumentUpload.tsx
          git commit -m "Deduplicate Phase 2 artifact metadata"
          git push origin HEAD:agent/phase-2-canonical-source-inventory
