name: Phase 2.2.1 source-cue recovery

on:
  push:
    branches:
      - agent/fix-phase221-source-cue-recovery

permissions:
  contents: write

concurrency:
  group: phase221-source-cue-recovery
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-phase221-source-cue-recovery

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply source-block and bounded-correction patch
        run: python backend/scripts/apply_phase221_source_cue_fix.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run focused regression tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_phase221_source_cue_recovery.py \
            tests/test_canonical_source_phase221_fallback.py

      - name: Remove one-shot patch machinery and commit
        run: |
          rm -f .github/workflows/phase221-source-cue-recovery.yml
          rm -f backend/scripts/apply_phase221_source_cue_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/canonical_source_phase221_fallback.py \
                  backend/tests/test_phase221_source_cue_recovery.py \
                  backend/scripts/apply_phase221_source_cue_fix.py \
                  .github/workflows/phase221-source-cue-recovery.yml
          git commit -m "Fix Phase 2.2.1 source cue recovery"
          git push origin HEAD:agent/fix-phase221-source-cue-recovery
