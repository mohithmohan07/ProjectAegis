name: Publish reviewed Grade 7 ICSE master image only

on:
  push:
    branches: [codex/grade7-icse-master-image-assets]
    paths:
      - '.github/workflows/publish-concept-images.yml'
      - 'ops/concept-image-assets/grade7-icse-2026-09-24/**'

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  publish-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Publish reviewed source image and verify public URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python backend/scripts/publish_concept_images.py --assets ops/concept-image-assets/grade7-icse-2026-09-24
      - name: Save verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: grade7-icse-master-image-url-verification
          path: image-url-verification.json
          if-no-files-found: error
