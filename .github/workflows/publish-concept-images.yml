name: Publish reviewed concept images only

on:
  push:
    branches: [codex/social-english-image-assets]
    paths:
      - '.github/workflows/publish-concept-images.yml'
      - 'backend/scripts/publish_concept_images.py'
      - 'ops/concept-image-assets/2026-09-18/**'
      - 'ops/concept-image-assets/2026-10-18-kalmadi/**'
      - 'ops/concept-image-assets/2026-10-29-rs-aggarwal-batch01/**'
      - 'ops/concept-image-assets/2026-10-29-rs-aggarwal-batch02/**'

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  publish-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Publish content-addressed crops and verify public URLs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python backend/scripts/publish_concept_images.py --assets ops/concept-image-assets/2026-09-18
          mv image-url-verification.json previous-image-url-verification.json
          python backend/scripts/publish_concept_images.py --assets ops/concept-image-assets/2026-10-18-kalmadi
          mv image-url-verification.json kalmadi-image-url-verification.json
          python backend/scripts/publish_concept_images.py --assets ops/concept-image-assets/2026-10-29-rs-aggarwal-batch01
          mv image-url-verification.json rs-aggarwal-batch01-image-url-verification.json
          python backend/scripts/publish_concept_images.py --assets ops/concept-image-assets/2026-10-29-rs-aggarwal-batch02
      - name: Save verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: concept-image-url-verification
          path: '*image-url-verification.json'
          if-no-files-found: error
