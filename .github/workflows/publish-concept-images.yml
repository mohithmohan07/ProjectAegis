name: Publish Science Master answer images
on:
  push:
    branches: [codex/science-master-answer-images-20260930]
    paths:
      - '.github/workflows/publish-concept-images.yml'
      - 'ops/science-master-answer-images/2026-09-30/**'
permissions:
  contents: read
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  publish-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Publish the nine reviewed answer diagrams and graph
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python backend/scripts/publish_concept_images.py --assets ops/science-master-answer-images/2026-09-30
      - uses: actions/upload-artifact@v4
        with:
          name: science-master-image-verification
          path: image-url-verification.json
          if-no-files-found: error
