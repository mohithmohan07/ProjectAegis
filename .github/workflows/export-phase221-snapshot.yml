name: Apply Phase 2.2.1 implementation

on:
  push:
    branches: ["agent/phase-2-2-1-pdf-acsd-fallback"]

permissions:
  contents: write

concurrency:
  group: phase221-one-shot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase221_payload/part* | base64 --decode > /tmp/phase221.patch.xz
          echo "6d414d1022c4626a499dc4c89a4d19572f2eefef5f88f3b83a86ef5820218a73  /tmp/phase221.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/phase221.patch.xz > /tmp/phase221.patch
      - name: Apply tested Phase 2.2.1 changes
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 --batch --forward < /tmp/phase221.patch
          rm -rf .phase221_payload
          rm -f .github/workflows/export-phase221-snapshot.yml
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Phase 2.2.1 PDF-to-ACSD fallback"
          git push origin HEAD:${GITHUB_REF_NAME}
