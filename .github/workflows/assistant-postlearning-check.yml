name: Assistant Post-Learning Check

on:
  push:
    branches:
      - assistant/job79-prelearning-formation-repair

concurrency:
  group: assistant-postlearning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AEGIS_USE_LIVE_GENERATION: "0"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile changed Python
        run: >-
          python -m py_compile
          app/services/language_topology_grade_contract.py
          app/services/postlearning_formation_contract.py
          app/services/postlearning_host_contract.py
          app/services/postlearning_support_contract.py
          app/services/postlearning_support_routing_contract.py
          app/services/prelearning_formation_contract.py
          tests/test_language_topology_grade_contract.py
          tests/test_postlearning_formation_contract.py
          tests/test_postlearning_host_contract.py
          tests/test_postlearning_support_contract.py
          tests/test_postlearning_support_routing_contract.py
          tests/test_prelearning_formation_contract.py
      - name: Focused regressions
        run: >-
          pytest -q
          tests/test_language_topology.py
          tests/test_language_topology_grade_contract.py
          tests/test_postlearning_formation_contract.py
          tests/test_postlearning_host_contract.py
          tests/test_postlearning_support_contract.py
          tests/test_postlearning_support_routing_contract.py
          tests/test_prelearning_formation_contract.py
