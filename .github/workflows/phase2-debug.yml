name: Phase 2 backend diagnostics

on:
  push:
    branches:
      - agent/phase-2-canonical-source-inventory
  pull_request:

permissions:
  contents: read

jobs:
  backend-diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/generate_dummy_data.py
      - name: Run backend suite with captured output
        id: tests
        continue-on-error: true
        run: |
          set +e
          pytest -q > /tmp/phase2-pytest.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics
        if: steps.tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: phase2-backend-failure
          path: /tmp/phase2-pytest.log
          retention-days: 1
      - name: Fail when tests fail
        if: steps.tests.outputs.status != '0'
        run: exit 1
