# fly.toml app configuration file generated for projectaegis on 2026-07-30T15:20:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'projectaegis'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  AEGIS_ALLOWED_GOOGLE_DOMAIN = 'up.school'
  AEGIS_AUTH_MODE = 'google'
  AEGIS_DATA_DIR = '/data'
  AEGIS_DB_URL = 'sqlite:////data/aegis.db'
  AEGIS_OPENAI_MODEL = 'gpt-5.6-luna'
  AEGIS_PUBLIC_BASE_URL = 'https://projectaegis.fly.dev'
  # The rewritten Phase 3 is the only post-81% pipeline; the old
  # AEGIS_PHASE3_REWRITE migration flag is retired (legacy lane deleted).
  # The shared OpenAI gate is a safety ceiling, not a no-queue promise.
  # Most stages contribute one 16-worker fan-out per run, while the two
  # concurrent Master lanes can briefly contribute 2 x 16 = 32 contenders.
  # A second/third creator therefore enters bounded queues behind the 48
  # slots, subject to AEGIS_OPENAI_SLOT_WAIT_TIMEOUT_SECONDS; sustained
  # queueing can still fail a run. Size with runs x overlapping lanes x
  # workers <= gate when queue-free latency is required. The [[vm]] below is
  # sized for the 48-slot ceiling; workers=1 restores strict sequential work.
  AEGIS_OPENAI_MAX_CONCURRENCY = '48'
  AEGIS_PHASE3_DECISION_WORKERS = '16'
  AEGIS_SOURCE_CHUNK_WORKERS = '10'
  AEGIS_GPT_PDF_ACSD_PARALLEL_BATCHES = '3'
  # Q50: new runs freeze GPT-5.6 Luna for every author, reviewer and Fixer.
  # Stage-specific reasoning effort remains in the recorded model profile.
  # OPENAI_API_KEY is a server secret; Gemini is only for historical replay.
  # This legacy effort setting preserves historical unprofiled runs.
  # All author, critic, Refiner and group-QA stages remain enabled.
  AEGIS_OPENAI_REASONING_PROFILE = 'uniform-xhigh'
  AEGIS_CONCEPT_REFINER = 'all'
  AEGIS_MASTER_REFINER = '1'
  AEGIS_MASTER_GROUP_QA = '1'
  AEGIS_MASTER_CRITICS = 'all'
  PORT = '8000'

[[mounts]]
  source = 'aegis_data'
  destination = '/data'
  # New volumes must not inherit Fly's 1GB default: /data holds SQLite,
  # uploads, durable model decisions, release versions, workbooks, and the
  # learner-facing source-asset store. Existing volumes are not resized by
  # initial_size; use the non-destructive ENOSPC runbook in README.md once.
  initial_size = '10GB'
  # Preserve working headroom as the durable corpus grows. Fly extends the
  # volume in 5GB steps at 80% use, with a deliberate 50GB cost ceiling.
  # Capacity beyond that ceiling requires an explicit operator decision.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '5GB'
  auto_extend_size_limit = '50GB'
  # The volume is learner-facing infrastructure (Q8): published image URLs
  # resolve from it. Keep a month of daily snapshots instead of the 5-day
  # default so an operator can restore past a late-noticed loss.
  # NOTE: this setting only applies to volumes fly deploy CREATES. An existing
  # aegis_data volume must be updated once, out of band:
  #   fly volumes update <volume-id> --snapshot-retention 30
  snapshot_retention = 30

[http_service]
  internal_port = 8000
  force_https = true
  # A generation run executes on a worker thread INSIDE this machine.
  # With min_machines_running = 0, Fly stopped the machine as soon as no
  # HTTP connection was open — which is exactly what happens when the
  # operator's phone tab freezes mid-run — and the run died with it
  # (owner report, 2026-08-20: "resumed from its saved checkpoint").
  # One machine stays up so runs genuinely continue in the background;
  # auto_stop still reclaims any extra machines.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  cpu_kind = 'shared'
  # 48 in-flight provider calls are 48 worker threads holding response
  # payloads, and Step 2 runs TWO lanes that each read a reviewed workbook
  # before the first call. Measured on job 139 (Q57): the old reader spent
  # 306MB on a 0.48MB file, and two lanes doing that on 2048MB killed the
  # process mid-run — the machine restarted and the console got a bare 502.
  # The reader now streams (a few MB), and this headroom is the second half:
  # an OOM must not be one large upload away.
  #
  # Fly caps a SHARED vm at 2048MB per CPU, so this pair is not free to choose
  # independently: 2 CPUs allow at most 4096MB ("memory size for config is too
  # high", measured 13 September 2026 when 10240 was attempted here). 4096 is
  # double the ceiling that OOMed, and the streaming reader now needs single
  # -digit MB per lane rather than 306MB, so the pressure this guarded against
  # is gone rather than merely survivable. More than this needs more CPUs too:
  # 10240MB requires shared-cpu-8x.
  cpus = 2
  memory_mb = 4096
