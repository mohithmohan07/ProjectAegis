<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="white"/><title>Chapter 3 number line and magic square</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:bold}.label{font-size:22px}.small{font-size:18px}.line{stroke:#111;stroke-width:4}.thin{stroke:#111;stroke-width:2}.point{fill:#111}.cell{fill:none;stroke:#111;stroke-width:3}</style><rect x="20" y="20" width="560" height="52" rx="8" fill="#edf2f7" stroke="#aab7c4"/><text class="title" x="34" y="55">CH3-A01: Integers marked on a number line</text><line class="line" x1="70" y1="240" x2="550" y2="240"/><polyline class="line" points="538,248 550,240 538,232"/><polyline class="line" points="82,232 70,240 82,248"/><g class="thin"> <line x1="110" y1="225" x2="110" y2="255"/><line x1="150" y1="225" x2="150" y2="255"/><line x1="190" y1="225" x2="190" y2="255"/><line x1="230" y1="225" x2="230" y2="255"/><line x1="270" y1="225" x2="270" y2="255"/><line x1="310" y1="225" x2="310" y2="255"/><line x1="350" y1="225" x2="350" y2="255"/><line x1="390" y1="225" x2="390" y2="255"/><line x1="430" y1="225" x2="430" y2="255"/><line x1="470" y1="225" x2="470" y2="255"/><line x1="510" y1="225" x2="510" y2="255"/></g><g class="small"><text x="100" y="285">−5</text><text x="140" y="285">−4</text><text x="180" y="285">−3</text><text x="220" y="285">−2</text><text x="260" y="285">−1</text><text x="305" y="285">0</text><text x="345" y="285">1</text><text x="385" y="285">2</text><text x="425" y="285">3</text><text x="465" y="285">4</text><text x="505" y="285">5</text></g><circle class="point" cx="110" cy="240" r="8"/><circle class="point" cx="190" cy="240" r="8"/><circle class="point" cx="430" cy="240" r="8"/><circle class="point" cx="590" cy="240" r="8"/><text class="small" x="70" y="350">Marked values: −5, −3, 3 and 7. The positive end continues to 7.</text><rect x="650" y="20" width="530" height="52" rx="8" fill="#edf2f7" stroke="#aab7c4"/><text class="title" x="664" y="55">CH3-Q02: Complete the 3 × 3 magic square</text><g transform="translate(765,120)"><rect class="cell" x="0" y="0" width="270" height="270"/><line class="cell" x1="90" y1="0" x2="90" y2="270"/><line class="cell" x1="180" y1="0" x2="180" y2="270"/><line class="cell" x1="0" y1="90" x2="270" y2="90"/><line class="cell" x1="0" y1="180" x2="270" y2="180"/><text class="title" x="35" y="58">8</text><text class="title" x="125" y="58">1</text><text class="title" x="215" y="58">6</text><text class="title" x="35" y="148">3</text><text class="title" x="125" y="148">5</text><text class="title" x="215" y="238">2</text></g><text class="small" x="690" y="440">Use the numbers 1 to 9 exactly once so every row, column and diagonal has the same sum.</text></svg>