<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="100%" height="100%" fill="white"/><title>Clock-angle diagrams</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:bold}.label{font-size:22px}.clock{fill:none;stroke:#111;stroke-width:4}.hand{stroke:#111;stroke-width:5;stroke-linecap:round}.tick{stroke:#555;stroke-width:2}</style><rect x="20" y="20" width="1160" height="52" rx="8" fill="#edf2f7" stroke="#aab7c4"/><text class="title" x="34" y="55">CH2-Q12: Draw the hands and identify the angle type at each time</text><g transform="translate(150,230)"><circle class="clock" r="105"/><line class="hand" x1="0" y1="0" x2="0" y2="-82"/><line class="hand" x1="0" y1="0" x2="70" y2="40"/><text class="label" x="-33" y="145">4:00</text></g><g transform="translate(450,230)"><circle class="clock" r="105"/><line class="hand" x1="0" y1="0" x2="0" y2="-82"/><line class="hand" x1="0" y1="0" x2="70" y2="-40"/><text class="label" x="-33" y="145">2:00</text></g><g transform="translate(750,230)"><circle class="clock" r="105"/><line class="hand" x1="0" y1="0" x2="0" y2="-82"/><line class="hand" x1="0" y1="0" x2="82" y2="0"/><text class="label" x="-33" y="145">3:00</text></g><g transform="translate(1050,230)"><circle class="clock" r="105"/><line class="hand" x1="0" y1="0" x2="0" y2="-82"/><line class="hand" x1="0" y1="0" x2="0" y2="82"/><text class="label" x="-33" y="145">6:00</text></g></svg>