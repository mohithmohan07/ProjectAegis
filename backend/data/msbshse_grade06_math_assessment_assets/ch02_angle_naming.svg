<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><title>Angle naming diagrams</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:bold}.label{font-size:22px}.line{fill:none;stroke:#111;stroke-width:4}.point{fill:#111}</style><rect x="20" y="20" width="1160" height="52" rx="8" fill="#edf2f7" stroke="#aab7c4"/><text class="title" x="34" y="55">CH2-Q07: Write the angle name, vertex and arms for each figure</text><g transform="translate(80,120)"><line class="line" x1="100" y1="180" x2="155" y2="55"/><line class="line" x1="100" y1="180" x2="235" y2="180"/><circle class="point" cx="100" cy="180" r="5"/><text class="label" x="78" y="212">Y</text><text class="label" x="158" y="50">K</text><text class="label" x="240" y="185">Z</text></g><g transform="translate(350,120)"><line class="line" x1="100" y1="180" x2="100" y2="50"/><line class="line" x1="100" y1="180" x2="235" y2="180"/><circle class="point" cx="100" cy="180" r="5"/><text class="label" x="78" y="212">D</text><text class="label" x="105" y="45">A</text><text class="label" x="240" y="185">R</text></g><g transform="translate(650,120)"><line class="line" x1="100" y1="180" x2="165" y2="45"/><line class="line" x1="100" y1="180" x2="245" y2="125"/><circle class="point" cx="100" cy="180" r="5"/><text class="label" x="78" y="212">A</text><text class="label" x="170" y="40">T</text><text class="label" x="250" y="130">P</text></g><g transform="translate(940,120)"><line class="line" x1="100" y1="180" x2="230" y2="145"/><line class="line" x1="100" y1="180" x2="100" y2="315"/><circle class="point" cx="100" cy="180" r="5"/><text class="label" x="78" y="212">A</text><text class="label" x="235" y="150">M</text><text class="label" x="105" y="320">P</text></g><rect x="20" y="440" width="1160" height="52" rx="8" fill="#edf2f7" stroke="#aab7c4"/><text class="title" x="34" y="475">CH2-Q08: Name the three angles formed at point B</text><g transform="translate(420,505)"><line class="line" x1="160" y1="170" x2="20" y2="130"/><line class="line" x1="160" y1="170" x2="95" y2="20"/><line class="line" x1="160" y1="170" x2="290" y2="45"/><circle class="point" cx="160" cy="170" r="5"/><text class="label" x="145" y="205">B</text><text class="label" x="0" y="128">A</text><text class="label" x="80" y="18">C</text><text class="label" x="295" y="45">D</text></g></svg>