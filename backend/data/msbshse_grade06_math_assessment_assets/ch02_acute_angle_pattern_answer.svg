<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"><rect width="100%" height="100%" fill="white"/><title>Acute-angle pattern model answer</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:bold}.label{font-size:22px}.line{fill:none;stroke:#111;stroke-width:4}</style><rect x="20" y="20" width="720" height="52" rx="8" fill="#edf2f7" stroke="#aab7c4"/><text class="title" x="34" y="55">CH2-A03: One acceptable continuation of the pattern</text><g transform="translate(230,105)"><polygon class="line" points="150,0 0,260 300,260"/><line class="line" x1="75" y1="130" x2="225" y2="130"/><line class="line" x1="75" y1="130" x2="150" y2="260"/><line class="line" x1="225" y1="130" x2="150" y2="260"/><polygon class="line" points="150,130 112.5,195 187.5,195"/><polygon class="line" points="150,195 131.25,227.5 168.75,227.5"/></g><text class="label" x="140" y="410">Acute-angle counts: 3, 12, 21, 30.</text><text class="label" x="140" y="450">The number increases by 9 at each stage.</text></svg>