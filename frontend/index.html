<html lang="en">

    <meta name="description" content="Aegis — the content intelligence engine behind Clarius. Textbook-grounded concept maps and assessments, verified against the source." />

    <meta name="theme-color" content="#0b0d13" media="(prefers-color-scheme: dark)" />

    <script>
      // Apply a saved theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem("aegis-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) { /* storage unavailable: follow the system */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
